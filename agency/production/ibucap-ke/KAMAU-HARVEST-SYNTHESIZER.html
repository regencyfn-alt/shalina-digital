<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAMAU — THE HARVEST · Ibucap KE · Synthesizer</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #F07D1A;
      --blue:   #1E86D6;
      --green:  #4CAF50;
      --red:    #E05050;
      --bg:     #0D0D0D;
      --s1:     #161616;
      --s2:     #1E1E1E;
      --s3:     #252525;
      --b1:     #2A2A2A;
      --b2:     #363636;
      --t1:     #F0EDE8;
      --t2:     #9A9590;
      --t3:     #5A5550;
      --r:      8px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--t1);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── HEADER ─── */
    .hdr {
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--b1);
      background: rgba(13,13,13,0.96);
      backdrop-filter: blur(8px);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .hdr-l { display: flex; align-items: center; gap: 18px; }
    .brand-badge {
      background: var(--orange); color: #000;
      font-size: 10px; font-weight: 800; letter-spacing: .14em;
      text-transform: uppercase; padding: 4px 10px; border-radius: 4px;
    }
    .film-name  { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
    .film-sub   { font-size: 11px; color: var(--t3); letter-spacing: .05em; text-transform: uppercase; margin-top: 2px; }
    .hdr-r { display: flex; align-items: center; gap: 12px; }

    .status-pill {
      display: flex; align-items: center; gap: 8px;
      background: var(--s2); border: 1px solid var(--b1);
      padding: 6px 14px; border-radius: 20px; font-size: 12px; color: var(--t2);
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--t3); transition: background .3s; flex-shrink: 0; }
    .dot.ready   { background: var(--green); box-shadow: 0 0 6px rgba(76,175,80,.5); }
    .dot.playing { background: var(--blue); animation: blink 1.2s ease infinite; box-shadow: 0 0 6px rgba(30,134,214,.5); }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

    .btn-sting-mute {
      background: var(--s2); border: 1px solid var(--b1);
      color: var(--t2); font-family: inherit; font-size: 11px; font-weight: 600;
      padding: 6px 14px; border-radius: 20px; cursor: pointer; transition: all .15s;
    }
    .btn-sting-mute:hover { border-color: var(--orange); color: var(--orange); }
    .btn-sting-mute.muted { border-color: var(--t3); color: var(--t3); }

    /* ─── PAGE LAYOUT ─── */
    .page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 32px 80px;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 48px;
      align-items: start;
    }

    /* ─── LEFT COLUMN ─── */
    .left-col { display: flex; flex-direction: column; gap: 40px; }

    /* ─── PLAYER ─── */
    .player-wrap {
      display: flex;
      gap: 32px;
      align-items: flex-start;
    }
    .screen-wrap {
      flex-shrink: 0;
      width: 200px;
      aspect-ratio: 9/16;
      background: #000;
      border: 1px solid var(--b1);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }
    .vid-layer {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; display: block;
    }
    #vidA { z-index: 2; opacity: 1; }
    #vidB { z-index: 1; opacity: 1; }
    /* hidden preload pool */
    .preload-pool { display: none; }

    .idle-ov {
      position: absolute; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; background: rgba(0,0,0,.92); color: var(--t3);
      font-size: 11px; text-align: center; padding: 16px;
    }
    .idle-icon {
      width: 40px; height: 40px; border: 1.5px solid var(--b2); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .idle-icon svg { width: 18px; height: 18px; fill: var(--t3); }

    .player-info { flex: 1; display: flex; flex-direction: column; gap: 16px; }

    .now-playing {
      background: var(--s2); border: 1px solid var(--b1); border-radius: var(--r);
      padding: 14px 16px;
    }
    .np-label { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); margin-bottom: 4px; }
    .np-title { font-size: 18px; font-weight: 700; line-height: 1.3; }
    .np-sub { font-size: 12px; color: var(--t3); margin-top: 4px; line-height: 1.5; }

    .beat-bar { display: flex; gap: 4px; }
    .bs { flex: 1; height: 3px; background: var(--b1); border-radius: 3px; transition: background .3s; }
    .bs.done   { background: var(--orange); }
    .bs.active { background: var(--blue); animation: pulse-bar 1.5s ease infinite; }
    @keyframes pulse-bar { 0%,100%{opacity:1} 50%{opacity:.6} }

    .ctrl-row { display: flex; flex-direction: column; gap: 8px; }
    .btn-play {
      background: var(--orange); color: #000; border: none;
      border-radius: var(--r); font-size: 14px; font-weight: 700; font-family: inherit;
      letter-spacing: .04em; padding: 13px 20px; cursor: pointer; transition: background .15s, opacity .15s;
      text-align: center;
    }
    .btn-play:hover { background: #FF8F30; }
    .btn-play:disabled { opacity: .35; cursor: not-allowed; background: var(--orange); }
    .btn-secondary {
      background: transparent; color: var(--t2); border: 1px solid var(--b1);
      border-radius: var(--r); font-size: 12px; font-weight: 600; font-family: inherit;
      padding: 10px 20px; cursor: pointer; transition: border-color .15s, color .15s;
    }
    .btn-secondary:hover { border-color: var(--blue); color: var(--blue); }
    .btn-secondary:disabled { opacity: .35; cursor: not-allowed; }

    /* ─── SECTION HEADING ─── */
    .sec-heading {
      font-size: 10px; font-weight: 700; letter-spacing: .16em;
      text-transform: uppercase; color: var(--t3); margin-bottom: 16px;
      padding-bottom: 10px; border-bottom: 1px solid var(--b1);
    }

    /* ─── BEAT CARDS ─── */
    .beat-list { display: flex; flex-direction: column; gap: 0; }

    /* Timeline row with transitions between cards */
    .beat-row { display: flex; flex-direction: column; }

    /* Transition pill between beats */
    .trans-pill-wrap {
      display: flex; align-items: center; justify-content: center;
      padding: 8px 0;
    }
    .trans-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 18px; border-radius: 20px; cursor: pointer;
      font-size: 12px; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; border: 2px solid; transition: all .15s;
      user-select: none;
    }
    .trans-pill.cut   { color: var(--t2); border-color: var(--b2); background: rgba(90,85,80,.12); }
    .trans-pill.cut:hover { border-color: var(--t2); }
    .trans-pill.fade  { color: var(--orange); border-color: rgba(240,125,26,.5); background: rgba(240,125,26,.1); }
    .trans-pill.fade:hover { background: rgba(240,125,26,.18); }
    .trans-pill.cross { color: var(--blue); border-color: rgba(30,134,214,.5); background: rgba(30,134,214,.1); }
    .trans-pill.cross:hover { background: rgba(30,134,214,.18); }
    .trans-arrow { font-size: 10px; opacity: .6; }

    /* Beat card */
    .bc {
      background: var(--s2); border: 1px solid var(--b1); border-radius: 10px;
      padding: 20px 20px 20px 16px;
      transition: border-color .2s, background .2s, box-shadow .2s;
      cursor: default;
      display: flex; align-items: flex-start; gap: 14px;
      min-height: 280px;
      position: relative;
    }
    .bc:hover  { background: var(--s3); border-color: var(--b2); }
    .bc.confirmed { border-color: rgba(76,175,80,.3); }
    .bc.needs_regen { border-color: rgba(240,125,26,.25); }
    .bc.active {
      border-color: var(--blue);
      background: rgba(30,134,214,.06);
      box-shadow: 0 0 0 1px rgba(30,134,214,.2);
    }

    /* Drag handle */
    .drag-handle {
      flex-shrink: 0; color: var(--t3); cursor: grab;
      font-size: 18px; line-height: 1; padding-top: 2px;
      transition: color .15s;
      user-select: none;
    }
    .drag-handle:hover { color: var(--t2); }
    .bc.dragging { opacity: .4; }
    .bc.drag-over { border-color: var(--orange); background: rgba(240,125,26,.06); }

    /* Delete button */
    .btn-delete {
      position: absolute; top: 12px; right: 14px;
      background: transparent; border: 1px solid transparent;
      color: var(--t3); font-size: 16px; line-height: 1; cursor: pointer;
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s;
    }
    .btn-delete:hover { color: var(--red); border-color: rgba(224,80,80,.4); background: rgba(224,80,80,.08); }

    .bc-content { flex: 1; min-width: 0; }

    .bc-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .bc-num   { font-size: 10px; font-weight: 700; letter-spacing: .12em; color: var(--t3); text-transform: uppercase; }
    .bc-title { font-size: 22px; font-weight: 700; line-height: 1.2; letter-spacing: -.02em; margin-top: 4px; }

    /* Status badge */
    .status-badge {
      flex-shrink: 0; margin-left: auto;
      font-size: 12px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; padding: 5px 12px; border-radius: 5px;
      white-space: nowrap;
    }
    .status-badge.confirmed {
      background: rgba(76,175,80,.15); color: var(--green);
      border: 1.5px solid rgba(76,175,80,.35);
    }
    .status-badge.needs_regen {
      background: rgba(240,125,26,.12); color: var(--orange);
      border: 1.5px solid rgba(240,125,26,.35);
    }
    .status-badge.playing {
      background: rgba(30,134,214,.15); color: var(--blue);
      border: 1.5px solid rgba(30,134,214,.4);
      animation: badge-pulse 1.5s ease infinite;
    }
    @keyframes badge-pulse { 0%,100%{opacity:1} 50%{opacity:.6} }

    .bc-storyboard {
      font-size: 15px; color: var(--t2); line-height: 1.75;
      margin-bottom: 12px;
    }

    .bc-vo {
      font-size: 14px; color: var(--t1); font-style: italic;
      line-height: 1.6; margin-bottom: 14px;
      padding: 10px 14px; border-left: 3px solid var(--orange);
      background: rgba(240,125,26,.06); border-radius: 0 5px 5px 0;
    }

    .bc-triple {
      font-size: 12px; color: var(--t3); letter-spacing: .05em;
      margin-bottom: 14px;
    }
    .bc-triple strong { color: var(--t2); }

    /* ─── RIGHT COLUMN ─── */
    .right-col { display: flex; flex-direction: column; gap: 32px; position: sticky; top: 80px; }

    /* ─── FFMPEG PANEL ─── */
    .ffmpeg-panel {
      background: var(--s1); border: 1px solid var(--b1);
      border-radius: var(--r); overflow: hidden;
    }
    .ffmpeg-hdr {
      background: var(--s2); padding: 12px 16px;
      font-size: 10px; font-weight: 700; letter-spacing: .14em;
      text-transform: uppercase; color: var(--t3);
      border-bottom: 1px solid var(--b1);
      display: flex; align-items: center; justify-content: space-between;
    }
    .ffmpeg-state { font-size: 11px; font-weight: 600; }
    .ffmpeg-state.ready { color: #A3D977; }
    .ffmpeg-body { padding: 14px 16px; }
    .ffcmd {
      font-family: 'Courier New', monospace; font-size: 11px; color: #A3D977;
      line-height: 1.65; white-space: pre-wrap; word-break: break-all;
      background: #0A0A0A; padding: 12px; border-radius: 5px;
      border: 1px solid var(--b1); max-height: 320px; overflow-y: auto;
    }
    .ffcmd-placeholder { font-size: 12px; color: var(--t3); text-align: center; padding: 20px 0; }
    .btn-copy-cmd {
      margin-top: 10px; width: 100%;
      background: rgba(163,217,119,.08); color: #A3D977;
      border: 1px solid rgba(163,217,119,.3); border-radius: var(--r);
      font-size: 12px; font-weight: 600; font-family: inherit;
      padding: 9px; cursor: pointer; transition: background .15s;
    }
    .btn-copy-cmd:hover { background: rgba(163,217,119,.16); }

    /* ─── SCORE PANEL ─── */
    .score-panel {
      background: var(--s2); border: 1px solid var(--b1);
      border-radius: var(--r); padding: 16px;
    }
    .score-label { font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--t3); margin-bottom: 12px; }
    .score-sting-row {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12px; color: var(--t2); padding: 8px 0;
      border-bottom: 1px solid var(--b1); margin-bottom: 8px;
    }
    .score-sting-name { font-weight: 600; color: var(--t1); }
    .score-sting-note { font-size: 11px; color: var(--t3); }

    /* ─── SCROLLBAR ─── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--b1); border-radius: 3px; }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 900px) {
      .page { grid-template-columns: 1fr; gap: 32px; padding: 24px 16px 60px; }
      .right-col { position: static; }
      .player-wrap { flex-direction: column; align-items: center; }
      .screen-wrap { width: 160px; }
    }
  </style>
</head>
<body>

<!-- ══════════════════════ HEADER ══════════════════════ -->
<header class="hdr">
  <div class="hdr-l">
    <div class="brand-badge">Ibucap KE</div>
    <div>
      <div class="film-name">KAMAU — THE HARVEST</div>
      <div class="film-sub">Story 07 · Seedance 2.0 · 5 Beats · 9:16</div>
    </div>
  </div>
  <div class="hdr-r">
    <button class="btn-sting-mute" id="btnStingMute" onclick="toggleStingMute()">🔔 Sting On</button>
    <div class="status-pill">
      <div class="dot" id="hdrDot"></div>
      <span id="hdrTxt">Ready</span>
    </div>
  </div>
</header>

<!-- ══════════════════════ PAGE ══════════════════════ -->
<div class="page">

  <!-- ── LEFT COLUMN ── -->
  <div class="left-col">

    <!-- PLAYER -->
    <div class="player-wrap">
      <div class="screen-wrap" id="screenWrap">
        <video id="vidA" class="vid-layer" playsinline></video>
        <video id="vidB" class="vid-layer" playsinline></video>
        <div class="idle-ov" id="idleOv">
          <div class="idle-icon">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </div>
          <span>Press Play All</span>
        </div>
      </div>

      <div class="player-info">
        <div class="now-playing">
          <div class="np-label" id="npLabel">Idle</div>
          <div class="np-title" id="npTitle">—</div>
          <div class="np-sub" id="npSub">Press Play All to preview the sequence</div>
        </div>

        <div class="beat-bar" id="beatBar"></div>

        <div class="ctrl-row">
          <button class="btn-play" id="btnPlay" onclick="startSeq()" disabled>▶ Play All</button>
          <button class="btn-secondary" id="btnStop" onclick="stopAll()" disabled>■ Stop</button>
        </div>
      </div>
    </div>

    <!-- BEAT SEQUENCE -->
    <div>
      <div class="sec-heading">Beat Sequence</div>
      <div class="beat-list" id="beatList"></div>
    </div>

  </div>

  <!-- ── RIGHT COLUMN ── -->
  <div class="right-col">

    <!-- SCORE / STING -->
    <div class="score-panel">
      <div class="score-label">Brand Audio</div>
      <div class="score-sting-row">
        <div>
          <div class="score-sting-name">ibucap-power-of-three.mp3</div>
          <div class="score-sting-note">Fires when last beat begins · toggle mute in header</div>
        </div>
        <div id="stingStatus" style="font-size:11px;color:var(--t3);">Loading…</div>
      </div>
    </div>

    <!-- FFMPEG -->
    <div class="ffmpeg-panel">
      <div class="ffmpeg-hdr">
        <span>ffmpeg Stitch Command</span>
        <span class="ffmpeg-state" id="ffmpegState">All clips embedded</span>
      </div>
      <div class="ffmpeg-body">
        <pre class="ffcmd" id="ffCmd"></pre>
        <button class="btn-copy-cmd" id="btnCopyCmd" onclick="copyCmd()">Copy ffmpeg command</button>
      </div>
    </div>

  </div>
</div>

<!-- Hidden preload pool -->
<div class="preload-pool" id="preloadPool"></div>

<script>
// ═══════════════════════════════════════════════════
//  FILM DATA
// ═══════════════════════════════════════════════════
const FILM_TITLE = "KAMAU — THE HARVEST";

// This is the live, mutable array — reorder/delete ops modify it in place
let BEATS = [
  {
    num: "01",
    title: "Wide Dawn",
    status: "confirmed",
    storyboard: "Wide shot down the tea rows — Kamau walking, checking the new flush, reading the leaves the way only thirty years of mornings can teach. Rift Valley hills behind him, valley mist not lifted yet. Harvest team arrives at the gate.",
    vo: "Kamau's shamba. Thirty years in every row.",
    triple_beat: null,
    url: "https://d8j0ntlcm91z4.cloudfront.net/user_30B8YEUkMsU6wmBq4m9Z6PDNqyv/hf_20260704_143419_fffe7d66-5ef2-436f-bffc-e555b4805ac9.mp4"
  },
  {
    num: "02",
    title: "Pain Arrives",
    status: "confirmed",
    storyboard: "Mid-morning — the lower back announces itself with that deep spreading burn from hours bent. Kamau straightens slowly. Hand to his lower back. He looks at what's left. Keeps moving. A worker calls: 'Bwana — truck inakuja saa sita.' Six weeks of growth on the line.",
    vo: null,
    triple_beat: null,
    url: "https://d8j0ntlcm91z4.cloudfront.net/user_30B8YEUkMsU6wmBq4m9Z6PDNqyv/hf_20260704_143402_39a4d2e3-a73f-4b78-8beb-5865e6fe8898.mp4"
  },
  {
    num: "03",
    title: "He Carries the Harvest",
    status: "needs_regen",
    storyboard: "The team works. Kamau works harder than any of them. Back settled into dull ache — he manages it with his stance, the way he bends. Close on his hands in the tea bushes: sure, steady, knowing. He is the pace.",
    vo: "He carries the whole harvest in his body.",
    triple_beat: null,
    url: "https://d8j0ntlcm91z4.cloudfront.net/user_30B8YEUkMsU6wmBq4m9Z6PDNqyv/hf_20260704_143404_967f7327-a360-469d-bc60-0b638fa7c439.mp4"
  },
  {
    num: "04",
    title: "Truck on the Road",
    status: "needs_regen",
    storyboard: "Last stretch. Back burns hard. A worker shouts from the gate: the truck's dust is visible on the road, coming early. Kamau registers it across the field. He looks at the rows left. Calls out. Everyone moves.",
    vo: null,
    triple_beat: null,
    url: "https://d8j0ntlcm91z4.cloudfront.net/user_30B8YEUkMsU6wmBq4m9Z6PDNqyv/hf_20260704_143421_1a83edd0-fa57-4431-ba0d-5b437c81d0c4.mp4"
  },
  {
    num: "05",
    title: "Resolution",
    status: "needs_regen",
    storyboard: "Last sack onto the truck. Driver weighs the load. Kamau takes the weight ticket — a good number. He stands at the field edge, watches the truck pull away down the valley road. Close on his face: quiet, complete, earned.",
    vo: null,
    triple_beat: "Face / Weight ticket in hand / Ibucap Kenya Mono Pack",
    url: "https://d8j0ntlcm91z4.cloudfront.net/user_30B8YEUkMsU6wmBq4m9Z6PDNqyv/hf_20260704_143408_63391e2f-be4c-40ba-9930-03bb71f6c444.mp4"
  }
];

// ═══════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════
const TRANS_CYCLE = ['cut', 'fade', 'cross'];
const TRANS_LABELS = { cut: 'CUT', fade: 'FADE', cross: 'CROSS' };
let transitions = ['cut', 'cut', 'cut', 'cut']; // n-1 between n clips; trimmed/expanded on reorder

let currentBeat = -1;
let isPlaying   = false;
let activeLayer = 'A';  // 'A' or 'B'
let stingMuted  = false;

// Preload elements keyed by URL
const preloadEls = {};

// ═══════════════════════════════════════════════════
//  VIDEO ELEMENTS
// ═══════════════════════════════════════════════════
const vidA = document.getElementById('vidA');
const vidB = document.getElementById('vidB');

function getActiveVid()   { return activeLayer === 'A' ? vidA : vidB; }
function getInactiveVid() { return activeLayer === 'A' ? vidB : vidA; }

// ═══════════════════════════════════════════════════
//  PRELOAD ALL CLIPS
// ═══════════════════════════════════════════════════
function preloadAll() {
  const pool = document.getElementById('preloadPool');
  pool.innerHTML = '';
  BEATS.forEach(b => {
    if (!b.url || preloadEls[b.url]) return;
    const v = document.createElement('video');
    v.preload = 'auto';
    v.muted   = true;
    v.src     = b.url;
    v.load();
    pool.appendChild(v);
    preloadEls[b.url] = v;
  });
}

// ═══════════════════════════════════════════════════
//  TRANSITIONS — ensured length matches BEATS.length - 1
// ═══════════════════════════════════════════════════
function ensureTransitions() {
  const needed = Math.max(0, BEATS.length - 1);
  while (transitions.length < needed) transitions.push('cut');
  transitions = transitions.slice(0, needed);
}

// ═══════════════════════════════════════════════════
//  RENDER BEAT LIST (with drag-and-drop)
// ═══════════════════════════════════════════════════
function renderBeatList() {
  ensureTransitions();
  const list = document.getElementById('beatList');
  list.innerHTML = '';

  BEATS.forEach((b, i) => {
    const isActive = (i === currentBeat && isPlaying);

    // ── Beat card ──
    const row = document.createElement('div');
    row.className = 'beat-row';
    row.dataset.index = i;

    const bc = document.createElement('div');
    bc.className = `bc ${b.status}${isActive ? ' active' : ''}`;
    bc.dataset.index = i;
    bc.draggable = true;

    // Status badge
    let badgeText = b.status === 'confirmed' ? 'CONFIRMED' : 'NEEDS REGEN — clip queued';
    if (isActive) badgeText = 'PLAYING';
    const badgeClass = isActive ? 'playing' : b.status;

    // VO block
    const voHtml = b.vo
      ? `<div class="bc-vo">"${b.vo}"</div>`
      : '';

    // Triple beat
    const tripleHtml = b.triple_beat
      ? `<div class="bc-triple"><strong>Triple beat:</strong> ${b.triple_beat}</div>`
      : '';

    bc.innerHTML = `
      <div class="drag-handle" title="Drag to reorder">⠿</div>
      <div class="bc-content">
        <div class="bc-top">
          <div>
            <div class="bc-num">Beat ${b.num}</div>
            <div class="bc-title">${b.title}</div>
          </div>
          <span class="status-badge ${badgeClass}">${badgeText}</span>
        </div>
        <div class="bc-storyboard">${b.storyboard}</div>
        ${voHtml}
        ${tripleHtml}
      </div>
      <button class="btn-delete" title="Remove beat" onclick="deleteBeat(${i})">×</button>
    `;

    // Drag events
    bc.addEventListener('dragstart', onDragStart);
    bc.addEventListener('dragover',  onDragOver);
    bc.addEventListener('dragleave', onDragLeave);
    bc.addEventListener('drop',      onDrop);
    bc.addEventListener('dragend',   onDragEnd);

    row.appendChild(bc);

    // ── Transition pill between beats ──
    if (i < BEATS.length - 1) {
      const pillWrap = document.createElement('div');
      pillWrap.className = 'trans-pill-wrap';
      const t = transitions[i];
      const pill = document.createElement('button');
      pill.className = `trans-pill ${t}`;
      pill.id = `trans-${i}`;
      pill.innerHTML = `<span class="trans-arrow">↓</span> ${TRANS_LABELS[t]} <span class="trans-arrow">↓</span>`;
      pill.title = 'Click to cycle transition type';
      pill.onclick = () => cycleTransition(i);
      pillWrap.appendChild(pill);
      row.appendChild(pillWrap);
    }

    list.appendChild(row);
  });

  // beat bar
  renderBeatBar();
  updatePlayBtn();
  updateHeader();
  updateFFMPEG();
}

function renderBeatBar() {
  const bar = document.getElementById('beatBar');
  bar.innerHTML = '';
  BEATS.forEach((_, i) => {
    const s = document.createElement('div');
    s.className = `bs${i < currentBeat ? ' done' : i === currentBeat && isPlaying ? ' active' : ''}`;
    bar.appendChild(s);
  });
}

// ═══════════════════════════════════════════════════
//  TRANSITIONS
// ═══════════════════════════════════════════════════
function cycleTransition(i) {
  const cur = TRANS_CYCLE.indexOf(transitions[i]);
  transitions[i] = TRANS_CYCLE[(cur + 1) % TRANS_CYCLE.length];
  const pill = document.getElementById(`trans-${i}`);
  if (pill) {
    const t = transitions[i];
    pill.className = `trans-pill ${t}`;
    pill.innerHTML = `<span class="trans-arrow">↓</span> ${TRANS_LABELS[t]} <span class="trans-arrow">↓</span>`;
  }
  updateFFMPEG();
}

// ═══════════════════════════════════════════════════
//  DRAG & DROP REORDER
// ═══════════════════════════════════════════════════
let dragSrcIndex = null;

function onDragStart(e) {
  const bc = e.currentTarget;
  dragSrcIndex = parseInt(bc.dataset.index);
  bc.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragSrcIndex);
}

function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const bc = e.currentTarget;
  bc.classList.add('drag-over');
}

function onDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}

function onDrop(e) {
  e.preventDefault();
  const bc = e.currentTarget;
  bc.classList.remove('drag-over');
  const targetIndex = parseInt(bc.dataset.index);
  if (dragSrcIndex === null || dragSrcIndex === targetIndex) return;

  // Reorder BEATS
  const moved = BEATS.splice(dragSrcIndex, 1)[0];
  BEATS.splice(targetIndex, 0, moved);

  // Reorder transitions (keep relative order, trim/pad)
  ensureTransitions();

  dragSrcIndex = null;
  renderBeatList();
  preloadAll();
}

function onDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  e.currentTarget.classList.remove('drag-over');
  dragSrcIndex = null;
}

// ═══════════════════════════════════════════════════
//  DELETE BEAT
// ═══════════════════════════════════════════════════
function deleteBeat(i) {
  if (BEATS.length <= 1) { alert('Cannot delete the last beat.'); return; }
  BEATS.splice(i, 1);
  ensureTransitions();
  renderBeatList();
}

// ═══════════════════════════════════════════════════
//  PLAYBACK
// ═══════════════════════════════════════════════════
async function startSeq() {
  stopAll(true);
  if (BEATS.length === 0) return;
  isPlaying = true;
  currentBeat = 0;
  document.getElementById('idleOv').style.display = 'none';
  document.getElementById('btnStop').disabled = false;
  renderBeatList();
  await playBeat(0);
}

async function playBeat(idx) {
  if (!isPlaying || idx >= BEATS.length) { finishSeq(); return; }
  const b = BEATS[idx];
  currentBeat = idx;
  renderBeatList();
  updateNowPlaying(b, idx);

  // Fire brand sting on the LAST beat (whatever is last after reordering)
  if (idx === BEATS.length - 1) fireSting();

  const vid = getActiveVid();
  vid.src = b.url;
  vid.load();
  try { await vid.play(); } catch(e) {}

  // Pre-buffer next clip into inactive layer while this one plays
  if (idx + 1 < BEATS.length) {
    const nextVid = getInactiveVid();
    nextVid.src = BEATS[idx + 1].url;
    nextVid.load();
    nextVid.pause();
  }

  // Wait until 80ms before end, then transition
  await waitForNearEnd(vid);

  if (!isPlaying) return;

  if (idx + 1 < BEATS.length) {
    await doTransition(idx, BEATS[idx + 1].url);
    await playBeat(idx + 1);
  } else {
    finishSeq();
  }
}

function waitForNearEnd(vid) {
  return new Promise(resolve => {
    function check() {
      if (!isPlaying) { resolve(); return; }
      if (vid.duration && vid.currentTime >= vid.duration - 0.08) {
        resolve(); return;
      }
      if (vid.ended) { resolve(); return; }
    }
    const tu = () => { check(); };
    const ended = () => { vid.removeEventListener('timeupdate', tu); vid.removeEventListener('ended', ended); resolve(); };
    vid.addEventListener('timeupdate', tu);
    vid.addEventListener('ended', ended);
  });
}

async function doTransition(fromIdx, nextUrl) {
  const transType = transitions[fromIdx] || 'cut';
  const cur  = getActiveVid();
  const next = getInactiveVid();

  if (transType === 'cut') {
    // Next clip already pre-buffered in inactive layer — instant z-index swap
    cur.pause();
    next.src = nextUrl;
    // ensure loaded (may already be from pre-buffer)
    if (next.src !== nextUrl) { next.src = nextUrl; next.load(); }
    // Instant swap
    cur.style.opacity = '1';
    next.style.opacity = '1';
    if (activeLayer === 'A') {
      vidA.style.zIndex = 1; vidB.style.zIndex = 2;
      activeLayer = 'B';
    } else {
      vidB.style.zIndex = 1; vidA.style.zIndex = 2;
      activeLayer = 'A';
    }
    cur.pause();

  } else if (transType === 'fade') {
    // Fade active layer to black, then swap
    cur.style.transition = 'opacity 350ms ease';
    cur.style.opacity = '0';
    await delay(350);
    cur.pause();
    // Swap layers
    if (activeLayer === 'A') {
      vidA.style.zIndex = 1; vidB.style.zIndex = 2;
      activeLayer = 'B';
    } else {
      vidB.style.zIndex = 1; vidA.style.zIndex = 2;
      activeLayer = 'A';
    }
    cur.style.transition = 'none';
    cur.style.opacity = '1'; // reset hidden layer for next use

  } else if (transType === 'cross') {
    // Next clip buffered in inactive layer, cross-fade them simultaneously
    next.src = nextUrl;
    if (!next.src || next.readyState < 2) next.load();
    next.style.transition = 'none';
    next.style.opacity = '0';
    // Bring next above
    if (activeLayer === 'A') {
      vidA.style.zIndex = 2; vidB.style.zIndex = 3;
    } else {
      vidB.style.zIndex = 2; vidA.style.zIndex = 3;
    }
    // Cross: cur fades out, next fades in
    cur.style.transition  = 'opacity 500ms ease';
    next.style.transition = 'opacity 500ms ease';
    cur.style.opacity  = '0';
    next.style.opacity = '1';
    await delay(500);
    cur.pause();
    cur.style.transition = 'none';
    cur.style.opacity = '1';  // reset for next use
    // Settle layers
    if (activeLayer === 'A') {
      vidA.style.zIndex = 1; vidB.style.zIndex = 2;
      activeLayer = 'B';
    } else {
      vidB.style.zIndex = 1; vidA.style.zIndex = 2;
      activeLayer = 'A';
    }
  }
}

function finishSeq() {
  isPlaying = false; currentBeat = -1;
  cancelAnimationFrame(window._rafId);
  document.getElementById('idleOv').style.display = 'flex';
  document.getElementById('btnStop').disabled = true;
  document.getElementById('npLabel').textContent = 'Idle';
  document.getElementById('npTitle').textContent = '—';
  document.getElementById('npSub').textContent = 'Sequence complete';
  document.getElementById('hdrDot').className = 'dot ready';
  document.getElementById('hdrTxt').textContent = 'Ready';
  vidA.pause(); vidA.style.opacity = '1'; vidA.style.zIndex = 2; vidA.style.transition = 'none';
  vidB.pause(); vidB.style.opacity = '1'; vidB.style.zIndex = 1; vidB.style.transition = 'none';
  activeLayer = 'A';
  renderBeatList();
}

function stopAll(silent) {
  isPlaying = false;
  vidA.pause(); vidA.onended = null;
  vidB.pause(); vidB.onended = null;
  if (!silent) finishSeq();
}

// ═══════════════════════════════════════════════════
//  NOW PLAYING UI
// ═══════════════════════════════════════════════════
function updateNowPlaying(b, idx) {
  document.getElementById('npLabel').textContent = `Now Playing — Beat ${b.num} of ${String(BEATS.length).padStart(2,'0')}`;
  document.getElementById('npTitle').textContent = b.title;
  document.getElementById('npSub').textContent   = b.storyboard.substring(0, 100) + '…';
  document.getElementById('hdrDot').className = 'dot playing';
  document.getElementById('hdrTxt').textContent = `Playing Beat ${b.num}`;
}

function updateHeader() {
  if (!isPlaying) {
    document.getElementById('hdrDot').className = 'dot ready';
    document.getElementById('hdrTxt').textContent = `${BEATS.length} beats ready`;
  }
}

function updatePlayBtn() {
  const btn = document.getElementById('btnPlay');
  const n = BEATS.filter(b => !!b.url).length;
  btn.disabled = n === 0;
  btn.textContent = `▶ Play All (${n} clip${n !== 1 ? 's' : ''})`;
}

// ═══════════════════════════════════════════════════
//  BRAND STING
// ═══════════════════════════════════════════════════
const STING_URL = '/studio/audio/ibucap-power-of-three.mp3';
let stingAudio = null;

function loadSting() {
  stingAudio = new Audio(STING_URL);
  stingAudio.preload = 'auto';
  stingAudio.volume  = 0.85;
  stingAudio.addEventListener('canplaythrough', () => {
    document.getElementById('stingStatus').textContent = 'Loaded';
    document.getElementById('stingStatus').style.color = 'var(--green)';
  });
  stingAudio.addEventListener('error', () => {
    document.getElementById('stingStatus').textContent = 'Not found';
    document.getElementById('stingStatus').style.color = 'var(--t3)';
  });
}

function fireSting() {
  if (stingMuted || !stingAudio) return;
  stingAudio.currentTime = 0;
  stingAudio.play().catch(() => {});
}

function stopSting() {
  if (stingAudio) { stingAudio.pause(); stingAudio.currentTime = 0; }
}

function toggleStingMute() {
  stingMuted = !stingMuted;
  const btn = document.getElementById('btnStingMute');
  btn.textContent = stingMuted ? '🔕 Sting Muted' : '🔔 Sting On';
  btn.classList.toggle('muted', stingMuted);
  if (stingMuted) stopSting();
}

// ═══════════════════════════════════════════════════
//  FFMPEG
// ═══════════════════════════════════════════════════
function updateFFMPEG() {
  const el = document.getElementById('ffCmd');
  const stateEl = document.getElementById('ffmpegState');

  const withUrls = BEATS.filter(b => !!b.url);
  if (withUrls.length === 0) {
    el.textContent = '# No clips in sequence.';
    stateEl.textContent = 'No clips';
    stateEl.className = 'ffmpeg-state';
    return;
  }

  stateEl.textContent = `${withUrls.length} clip${withUrls.length !== 1 ? 's' : ''} · updates on reorder`;
  stateEl.className = 'ffmpeg-state ready';

  const lines = [];
  lines.push('#!/bin/bash');
  lines.push('# KAMAU — THE HARVEST · Stitch command');
  lines.push('# Generated by CENTREFREE Synthesizer');
  lines.push('');
  lines.push('# 1. Download clips');

  BEATS.forEach((b, i) => {
    if (!b.url) return;
    const fname = `beat_${String(i+1).padStart(2,'0')}_${b.title.toLowerCase().replace(/[^a-z0-9]/g,'_')}.mp4`;
    lines.push(`curl -L "${b.url}" -o "${fname}"`);
  });

  lines.push('');
  lines.push('# 2. Build concat list');
  lines.push("cat > clips.txt << 'EOF'");
  BEATS.forEach((b, i) => {
    if (!b.url) return;
    const fname = `beat_${String(i+1).padStart(2,'0')}_${b.title.toLowerCase().replace(/[^a-z0-9]/g,'_')}.mp4`;
    lines.push(`file '${fname}'`);
  });
  lines.push('EOF');

  lines.push('');
  lines.push('# 3. Stitch');
  lines.push('ffmpeg -f concat -safe 0 -i clips.txt \\');
  lines.push('  -c:v libx264 -crf 18 -preset slow \\');
  lines.push('  -pix_fmt yuv420p \\');
  lines.push('  KAMAU-HARVEST-FINAL.mp4');

  el.textContent = lines.join('\n');
}

function copyCmd() {
  const el = document.getElementById('ffCmd');
  navigator.clipboard.writeText(el.textContent).then(() => {
    const btn = document.getElementById('btnCopyCmd');
    btn.textContent = '✓ Copied!';
    setTimeout(() => { btn.textContent = 'Copy ffmpeg command'; }, 2000);
  });
}

// ═══════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

// ═══════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════
loadSting();
preloadAll();
renderBeatList();
</script>
